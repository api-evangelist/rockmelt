description: Rockmelt was a Chromium-based social web browser startup founded in 2008 and backed by
  Andreessen Horowitz (a16z), designed to integrate Facebook, Twitter, and web feeds directly into the
  browser chrome. The company was acquired by Yahoo in August 2013 and its products were discontinued
  shortly after. It was surfaced as an a16z portfolio company and added to the API Evangelist network
  as a stub. Enrichment confirms the company is defunct with no live web, developer, or API surface.
